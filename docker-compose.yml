# Dev parity with `npm run dev`: same ports (5173 / 3001), same backend/.env, same SQLite file.
services:
  api:
    image: node:22-alpine
    working_dir: /app
    env_file: backend/.env
    environment:
      DATABASE_URL: file:./dev.db
      PORT: "3001"
    volumes:
      - ./backend:/app
      - api_node_modules:/app/node_modules
    ports:
      - "3001:3001"
    # Always npm ci: the named volume api_node_modules can outlive package-lock.json
    # changes (e.g. new deps like ws). A prisma-only check skipped install and broke imports.
    command: >
      sh -c "apk add --no-cache openssl
      && npm ci
      && npx prisma db push --skip-generate
      && npx prisma generate
      && npm run dev:docker"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 120s

  web:
    image: node:22-alpine
    working_dir: /app
    environment:
      API_PROXY_TARGET: http://api:3001
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"
    depends_on:
      api:
        condition: service_healthy

volumes:
  api_node_modules:
  web_node_modules:
