# Production build (nginx + compiled API). Same backend/.env and backend/dev.db as local dev.
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    environment:
      DATABASE_URL: file:./dev.db
      PORT: "3001"
      PHARMACY_SEARCH_PROVIDER: ${PHARMACY_SEARCH_PROVIDER:-nominatim}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      SEED_DATABASE: ${SEED_DATABASE:-false}
      VAPI_API_KEY: ${VAPI_API_KEY:-}
      VAPI_PHONE_NUMBER_ID: ${VAPI_PHONE_NUMBER_ID:-}
      VAPI_ASSISTANT_ID: ${VAPI_ASSISTANT_ID:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      VAPI_WEBHOOK_SECRET: ${VAPI_WEBHOOK_SECRET:-}
    volumes:
      - ./backend/dev.db:/app/dev.db
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
